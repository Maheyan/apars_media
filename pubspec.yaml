version: 1.0.3
homepage: https://pub.dev/packages/apars_media
repository: https://github.com/Maheyan/apars_media/
issue_tracker: https://github.com/Maheyan/apars_media/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  socket_io_client: '>=2.0.3 <4.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
